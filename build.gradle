buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Required for EMI in ForgeGradle dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()

    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    maven {
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }

    maven {
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI API
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.127')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.127')

    // Раскомментируй для запуска с JEI
    // runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.127')

    // EMI
    compileOnly fg.deobf('dev.emi:emi-forge:1.1.24+1.20.1:api')
    runtimeOnly fg.deobf('dev.emi:emi-forge:1.1.24+1.20.1')

    // ImmersiveUI 0.3.0
    runtimeOnly fg.deobf('maven.modrinth:9wv7LuMc:YbO8SNFq')

    // OctoLib 0.5.0.1+1.20.1
    runtimeOnly fg.deobf('maven.modrinth:RH2KUdKJ:HZ7KmyXp')

    // Subtle GUI Tweaks — точный файл из FUSHIGI 4.7.5
    runtimeOnly fg.deobf('curse.maven:subtle-gui-tweaks-1585762:8998789')

    runtimeOnly fg.deobf('maven.modrinth:lhGA9TYQ:1MKTLiiG')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    exclude '**/*.bbmodel'
    exclude '**/gui.zip'
    exclude '**/*_old.png'

    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'MixinConfigs'             : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}